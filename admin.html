<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>內門新齋味｜管理後台</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff8ed;color:#392b24;font-family:Arial,sans-serif}header{background:#861e25;color:#ffe2a0;padding:25px;text-align:center}header h1{margin:0 0 10px}main{max-width:1100px;margin:auto;padding:16px}.panel,.order,.stat{background:white;border:1px solid #e7d5b6;border-radius:12px;padding:16px;margin-bottom:12px}input,select,button{font-size:16px;padding:12px;border-radius:8px;margin:5px 0}input,select{width:100%;border:1px solid #ccc;background:white;color:#392b24}button{background:#861e25;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat strong{display:block;font-size:23px;color:#861e25;margin-top:8px}.order{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;line-height:1.7}#message{color:#861e25;white-space:pre-wrap}[hidden]{display:none!important}</style></head><body><header><h1>內門新齋味</h1>2027 新春年菜｜管理後台 V3</header><main><p id="message" role="status"></p><section id="loginPanel" class="panel"><h2>管理員登入</h2><form id="loginForm"><input id="email" type="email" placeholder="管理員電子郵件" autocomplete="username" required><input id="password" type="password" placeholder="管理員密碼" autocomplete="current-password" required><button id="loginButton">登入管理後台</button></form></section><section id="dashboard" hidden><div class="panel"><strong>管理員專區</strong> <button id="logoutButton">登出</button></div><nav class="panel" id="tabs"><button data-tab="orderView">訂單管理</button> <button data-tab="productView">商品管理</button> <button data-tab="stockView">備貨統計</button> <button data-tab="shipView">出貨管理</button></nav><section id="orderView"><div class="stats"><div class="stat">全部訂單<strong id="count">—</strong></div><div class="stat">待確認<strong id="pending">—</strong></div><div class="stat">已收款（目前狀態）<strong id="paid">—</strong></div><div class="stat">有效訂單總金額<strong id="total">—</strong></div></div><div class="panel"><h2>訂單管理</h2><input id="search" placeholder="搜尋訂單編號、姓名、電話"><select id="filter"></select><button id="refreshButton">重新整理</button> <button id="exportButton">匯出全部訂單 CSV</button><div id="orders"></div></div></section><section id="productView" class="panel" hidden><h2>商品管理</h2><p>修改後須儲存；購物網站是否同步仍需測試。</p><div id="productList"></div></section><section id="stockView" class="panel" hidden><h2>備貨統計</h2><label>訂單狀態<select id="stockStatus"></select></label><button id="stockExport">匯出備貨 CSV</button><button id="itemExport">匯出全部商品明細 CSV</button><div id="stockList"></div></section><section id="shipView" class="panel" hidden><h2>出貨管理</h2><label>配送日期<input type="date" id="shipDate"></label><label>配送方式<select id="shipMethod"><option value="">全部</option><option>宅配</option><option>自取</option></select></label><button id="shipExport">匯出出貨清單 CSV</button><div id="shipList"></div></section></section></main><script>
const db=supabase.createClient('https://jbwofjtmcvqmcapajtex.supabase.co','sb_publishable_fxFpGtj8PqgAzwg3NdZelQ_Cz4WEwg1');
const $=id=>document.getElementById(id), statuses=['待確認','已確認','已收款','備貨中','已出貨','已完成','已取消'];
const labels={order_no:'訂單編號',customer_name:'訂購人姓名',customer_phone:'訂購人電話',phone:'聯絡電話',recipient_name:'收件人姓名',recipient_phone:'收件人電話',delivery_method:'配送方式',delivery_address:'配送地址',delivery_date:'指定配送日期',payment_method:'付款方式',subtotal:'商品小計',shipping_fee:'運費',total:'訂單總金額',status:'訂單狀態',notes:'備註',created_at:'訂單建立時間'};
let orders=[],generation=0,loading=false;
const message=s=>$('message').textContent=s||'', money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW'), taiwanTime=s=>s?new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):'';
function el(tag,text=''){const e=document.createElement(tag);e.textContent=text;return e}function option(s,v,t=v){const e=el('option',t);e.value=v;s.append(e)}option($('filter'),'','全部訂單狀態');statuses.forEach(s=>option($('filter'),s));
function resetStats(){['count','pending','paid','total'].forEach(id=>$(id).textContent='—')}
function clearData(){generation++;loading=false;orders=[];$('orders').replaceChildren();$('dashboard').hidden=true;$('loginPanel').hidden=false;$('password').value='';$('search').value='';$('filter').value='';resetStats()}
async function requireAdmin(){const {data,error}=await db.rpc('is_shop_admin');if(error)throw error;if(data!==true){clearData();throw Error('沒有管理員權限，請重新登入')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;message('登入中…');try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error)throw error;await requireAdmin();$('loginPanel').hidden=true;$('dashboard').hidden=false;await loadOrders()}catch(e){clearData();await db.auth.signOut();message('登入失敗：'+e.message)}finally{$('loginButton').disabled=false}};
async function loadOrders(){if(loading)return false;loading=true;const token=++generation;orders=[];resetStats();$('orders').replaceChildren();message('讀取訂單中…');try{await requireAdmin();let result=[];for(let start=0;;start+=500){const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).order('id',{ascending:false}).range(start,start+499);if(error)throw error;if(token!==generation)return false;result.push(...data);if(data.length<500)break}orders=result;$('count').textContent=orders.length;$('pending').textContent=orders.filter(o=>o.status==='待確認').length;$('paid').textContent=orders.filter(o=>o.status==='已收款').length;$('total').textContent=money(orders.filter(o=>o.status!=='已取消').reduce((s,o)=>s+Number(o.total||0),0));renderOrders();message('');return true}catch(e){if(token===generation){orders=[];resetStats();$('orders').replaceChildren();message('讀取失敗：'+e.message)}return false}finally{if(token===generation)loading=false}}
function format(k,v){if(v==null)return '';if(k==='created_at')return taiwanTime(v);if(['subtotal','shipping_fee','total'].includes(k))return money(v);return String(v)}
function renderOrders(){const root=$('orders');root.replaceChildren();const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const filtered=orders.filter(o=>(!f||o.status===f)&&JSON.stringify(o).toLowerCase().includes(q));if(!filtered.length){root.textContent='目前沒有符合的訂單';return}filtered.forEach(o=>{const card=el('article');card.className='order';card.append(el('h3',o.order_no),el('p',(o.customer_name||'')+'｜'+o.status+'｜'+money(o.total)),el('p','建立時間：'+taiwanTime(o.created_at)));const select=el('select');select.setAttribute('aria-label','訂單狀態');statuses.forEach(s=>option(select,s));select.value=o.status;const save=el('button','儲存訂單狀態');card.append(select,save,el('br'));save.onclick=async()=>{const next=select.value;if(next===o.status||!statuses.includes(next))return;if(!confirm('訂單：'+o.order_no+'\n'+o.status+' → '+next+'\n確定修改？'))return;save.disabled=select.disabled=true;try{await requireAdmin();const {data,error}=await db.from('orders').update({status:next}).eq('id',o.id).eq('status',o.status).select('id,status').single();if(error)throw error;if(data?.status!==next)throw Error('未能確認更新結果');if(await loadOrders())message('訂單狀態已更新');}catch(e){message('更新失敗：'+e.message)}finally{save.disabled=select.disabled=false}};const btn=el('button','查看訂單明細'),detail=el('pre');detail.hidden=true;card.append(btn,detail);btn.onclick=async()=>{if(!detail.hidden){detail.hidden=true;btn.textContent='查看訂單明細';return}detail.hidden=false;detail.textContent='讀取中…';btn.textContent='收起明細';try{await requireAdmin();const lines=Object.keys(labels).filter(k=>k in o).map(k=>labels[k]+'：'+format(k,o[k]));const {data,error}=await db.from('order_items').select('*').eq('order_id',o.id);if(error)throw error;lines.push('','【訂購商品】');if(!data.length)lines.push('⚠ 此訂單缺少商品明細，請人工確認後再出貨。');data.forEach(i=>lines.push((i.product_name||'商品')+'\n單價：'+money(i.unit_price)+' × '+i.quantity+'\n小計：'+money(i.line_total)+'\n'));detail.textContent=lines.join('\n')}catch(e){detail.textContent='讀取明細失敗：'+e.message}};root.append(card)})}
$('search').oninput=renderOrders;$('filter').onchange=renderOrders;$('refreshButton').onclick=loadOrders;$('logoutButton').onclick=async()=>{clearData();const {error}=await db.auth.signOut();message(error?error.message:'已登出')};
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
$('exportButton').onclick=async()=>{try{await requireAdmin();if(!orders.length){message('沒有可匯出的訂單');return}const keys=Object.keys(labels).filter(k=>orders.some(o=>k in o));const csv=[keys.map(k=>csvCell(labels[k])).join(','),...orders.map(o=>keys.map(k=>csvCell(k==='created_at'?taiwanTime(o[k]):o[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));const a=el('a');a.href=url;a.download='內門新齋味訂單.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){message('匯出失敗：'+e.message)}};db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')clearData()});

const views=['orderView','productView','stockView','shipView'];
const bundle={1:'魚翅海鮮羹',2:'唐朝一品(腳庫)',4:'櫻花蝦米糕',5:'蝦仁肉捲(八寶丸)',7:'醬燒豬肋排',8:'紹興醉蝦',9:'鮑魚佛跳牆',12:'醉雞腿'};
let reportItems=[]; let reportReady=false; let viewToken=0;
const oldClear=clearData;clearData=function(){oldClear();viewToken++;reportItems=[];reportReady=false;['productList','stockList','shipList'].forEach(x=>$(x).replaceChildren());views.forEach(x=>$(x).hidden=x!=='orderView')};
async function allRows(table){let rows=[];for(let n=0;;n+=500){const {data,error}=await db.from(table).select('*').order('id').range(n,n+499);if(error)throw error;rows.push(...data);if(data.length<500)return rows}}
function csvDownload(name,headers,rows){const csv=[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));const a=el('a');a.href=url;a.download=name+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function openView(id){const t=++viewToken;views.forEach(x=>$(x).hidden=x!==id);message('');if(id==='orderView')return;const root=$(id==='productView'?'productList':id==='stockView'?'stockList':'shipList');root.textContent='讀取中…';reportReady=false;try{await requireAdmin();if(id==='productView'){const p=await allRows('products');if(t!==viewToken||$('dashboard').hidden)return;renderProducts(p)}else{if(!await loadOrders())throw Error('訂單讀取失敗');const items=await allRows('order_items');if(t!==viewToken||$('dashboard').hidden)return;reportItems=items;reportReady=true;renderStock();renderShip()}}catch(e){if(t===viewToken){root.textContent='讀取失敗：'+e.message;message(e.message)}}}
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>openView(b.dataset.tab));
function renderProducts(products){const root=$('productList');root.replaceChildren();products.forEach(p=>{const card=el('article');card.className='order';card.append(el('h3',p.id+'｜'+p.name));const fields={};for(const [k,title] of Object.entries({name:'商品名稱',price:'售價',category:'分類',image_url:'照片網址'})){const label=el('label',title);const input=el('input');input.value=p[k]??'';if(k==='price'){input.type='number';input.min='0';input.step='1'}label.append(input);card.append(label);fields[k]=input}const active=el('select');option(active,'true','上架');option(active,'false','下架');active.value=String(p.active);card.append(active);const save=el('button','儲存商品');card.append(save);save.onclick=async()=>{const v={name:fields.name.value.trim(),price:Number(fields.price.value),category:fields.category.value.trim(),image_url:fields.image_url.value.trim()||null,active:active.value==='true'};if(!v.name||!v.category||!fields.price.value.trim()||!Number.isSafeInteger(v.price)||v.price<0||v.price>2147483647){message('請確認品名、分類及整數售價');return}if(v.image_url){try{if(new URL(v.image_url).protocol!=='https:')throw Error()}catch{message('照片網址必須為 HTTPS');return}}if(!confirm('確定儲存商品 '+p.id+'？'))return;save.disabled=true;try{await requireAdmin();const {data,error}=await db.from('products').update(v).eq('id',p.id).select('id').single();if(error||!data)throw error||Error('未確認更新');message('商品已更新')}catch(e){message('更新失敗：'+e.message)}finally{save.disabled=false}};root.append(card)})}
option($('stockStatus'),'confirmed','已確認及後續狀態（不含取消）');option($('stockStatus'),'all','全部未取消（含待確認）');statuses.forEach(s=>option($('stockStatus'),s));
function stockData(){const f=$('stockStatus').value;const selected=orders.filter(o=>f==='all'?o.status!=='已取消':f==='confirmed'? !['待確認','已取消'].includes(o.status):o.status===f);const ids=new Set(selected.map(o=>o.id));const counts=new Map(),seen=new Set();function add(k,name,n){const old=counts.get(k);counts.set(k,{name,n:(old?.n||0)+n})}for(const i of reportItems){if(!ids.has(i.order_id))continue;seen.add(i.order_id);const n=Number(i.quantity);if(Number(i.product_id)===14||i.product_name==='團圓桌菜組'){for(const [k,name] of Object.entries(bundle))add(k,name,n)}else{const k=i.product_id==null?'name:'+i.product_name:String(i.product_id);add(k,bundle[k]||i.product_name,n)}}return {rows:[...counts.values()].sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant')),missing:selected.filter(o=>!seen.has(o.id))}}
function renderStock(){if(!reportReady)return;const root=$('stockList');root.replaceChildren();const d=stockData();d.rows.forEach(r=>root.append(el('p',r.name+'：'+r.n+' 份')));if(!d.rows.length)root.append(el('p','沒有符合的商品明細'));if(d.missing.length)root.append(el('p','⚠ 缺少明細，未納入統計：'+d.missing.map(o=>o.order_no).join('、')))}
$('stockStatus').onchange=renderStock;
async function reportAction(fn){try{await requireAdmin();if(!reportReady)throw Error('請先完成報表讀取');fn()}catch(e){message(e.message)}}
$('stockExport').onclick=()=>reportAction(()=>{const d=stockData();csvDownload('備貨統計',['菜色','數量','備註'],[...d.rows.map(r=>[r.name,r.n,'']),...d.missing.map(o=>['','', '缺少明細：'+o.order_no])])});
$('itemExport').onclick=()=>reportAction(()=>{const map=new Map(orders.map(o=>[o.id,o]));csvDownload('商品明細',['訂單編號','狀態','商品','單價','數量','小計'],reportItems.filter(i=>map.has(i.order_id)).map(i=>[map.get(i.order_id).order_no,map.get(i.order_id).status,i.product_name,i.unit_price,i.quantity,i.line_total]))});
function shipData(){return orders.filter(o=>!['待確認','已取消'].includes(o.status)&&(!$('shipDate').value||o.delivery_date===$('shipDate').value)&&(!$('shipMethod').value||o.delivery_method===$('shipMethod').value)).sort((a,b)=>a.delivery_date.localeCompare(b.delivery_date))}
function itemText(o){return reportItems.filter(i=>i.order_id===o.id).map(i=>i.product_name+' × '+i.quantity).join('；')||'⚠ 缺少明細'}
function renderShip(){if(!reportReady)return;const root=$('shipList');root.replaceChildren();root.append(el('p','排除待確認及已取消；包含已出貨及已完成紀錄。'));const rows=shipData();if(!rows.length)root.append(el('p','沒有符合的訂單'));rows.forEach(o=>{const c=el('article');c.className='order';c.append(el('h3',o.delivery_date+'｜'+o.delivery_method+'｜'+o.status),el('p',o.order_no+'｜'+o.recipient_name),el('p',itemText(o)));root.append(c)})}
$('shipDate').onchange=$('shipMethod').onchange=renderShip;
$('shipExport').onclick=()=>reportAction(()=>csvDownload('出貨清單',['訂單編號','配送日期','配送方式','狀態','收件人','電話','地址','付款方式','金額','商品明細','備註'],shipData().map(o=>[o.order_no,o.delivery_date,o.delivery_method,o.status,o.recipient_name,o.recipient_phone,o.delivery_address,o.payment_method,o.total,itemText(o),o.notes])));
</script></body></html>

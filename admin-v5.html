<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>內門新齋味｜管理後台</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff8ed;color:#392b24;font-family:Arial,sans-serif}header{background:#861e25;color:#ffe2a0;padding:25px;text-align:center}header h1{margin:0 0 10px}main{max-width:1100px;margin:auto;padding:16px}.panel,.order,.stat{background:white;border:1px solid #e7d5b6;border-radius:12px;padding:16px;margin-bottom:12px}input,select,button{font-size:16px;padding:12px;border-radius:8px;margin:5px 0}input,select{width:100%;border:1px solid #ccc;background:white;color:#392b24}button{background:#861e25;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat strong{display:block;font-size:23px;color:#861e25;margin-top:8px}.order{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;line-height:1.7}#message{color:#861e25;white-space:pre-wrap}[hidden]{display:none!important}</style></head><body><header><h1>內門新齋味</h1>2027 新春年菜｜管理後台 V5</header><main><p id="message" role="status"></p><section id="loginPanel" class="panel"><h2>管理員登入</h2><form id="loginForm"><input id="email" type="email" placeholder="管理員電子郵件" autocomplete="username" required><input id="password" type="password" placeholder="管理員密碼" autocomplete="current-password" required><button id="loginButton">登入管理後台</button></form></section><section id="dashboard" hidden><div class="panel"><strong>管理員專區</strong> <button id="logoutButton">登出</button></div><nav class="panel" id="tabs"><button data-tab="manualView">人工新增訂單</button> <button data-tab="orderView">訂單管理</button> <button data-tab="productView">商品管理</button> <button data-tab="stockView">備貨統計</button> <button data-tab="shipView">出貨管理</button></nav><section id="manualView" class="panel" hidden><h2>人工新增訂單</h2><p>新增時收件人預設同訂購人；如不同，請新增後至訂單管理修改。</p><form id="manualForm"><label>訂單來源<select id="mSource"><option>紙本</option><option>電話</option><option>LINE</option><option>其他</option></select></label><label>來源編號<input id="mRef" placeholder="選填"></label><label>姓名<input id="mName" required></label><label>電話<input id="mPhone" type="tel" required></label><label>取貨方式<select id="mDelivery"><option>自取</option><option>宅配</option></select></label><label id="mAddressLabel" hidden>宅配地址<input id="mAddress"></label><label>付款方式<select id="mPayment"><option>現金</option><option>轉帳</option><option>貨到付款</option></select></label><label>配送／取貨日期<input id="mDate" type="date" min="2027-01-25" max="2027-02-01" required></label><label>備註<input id="mNotes"></label><h3>選擇商品及數量</h3><div id="manualProducts"></div><p id="manualTotal"></p><button id="manualSave" disabled>確認新增訂單</button><p id="manualResult" role="status"></p></form></section><section id="orderView"><div class="stats"><div class="stat">全部訂單<strong id="count">—</strong></div><div class="stat">待確認<strong id="pending">—</strong></div><div class="stat">已收款（目前狀態）<strong id="paid">—</strong></div><div class="stat">有效訂單總金額<strong id="total">—</strong></div></div><div class="panel"><h2>訂單管理</h2><input id="search" placeholder="搜尋訂單編號、姓名、電話"><select id="filter"></select><button id="refreshButton">重新整理</button> <button id="exportButton">匯出全部訂單 CSV</button><div id="orders"></div></div></section><section id="productView" class="panel" hidden><h2>商品管理</h2><p>修改後須儲存；購物網站是否同步仍需測試。</p><div id="productList"></div></section><section id="stockView" class="panel" hidden><h2>備貨統計</h2><label>訂單狀態<select id="stockStatus"></select></label><button id="stockExport">匯出備貨 CSV</button><button id="itemExport">匯出全部商品明細 CSV</button><div id="stockList"></div></section><section id="shipView" class="panel" hidden><h2>出貨管理</h2><label>配送日期<input type="date" id="shipDate"></label><label>配送方式<select id="shipMethod"><option value="">全部</option><option>宅配</option><option>自取</option></select></label><button id="shipExport">匯出出貨清單 CSV</button><div id="shipList"></div></section></section></main><script>
const db=supabase.createClient('https://jbwofjtmcvqmcapajtex.supabase.co','sb_publishable_fxFpGtj8PqgAzwg3NdZelQ_Cz4WEwg1');
const $=id=>document.getElementById(id), statuses=['待確認','已確認','已收款','備貨中','已出貨','已完成','已取消'];
const labels={order_no:'訂單編號',customer_name:'訂購人姓名',customer_phone:'訂購人電話',phone:'聯絡電話',recipient_name:'收件人姓名',recipient_phone:'收件人電話',delivery_method:'配送方式',delivery_address:'配送地址',delivery_date:'指定配送日期',payment_method:'付款方式',subtotal:'商品小計',shipping_fee:'運費',total:'訂單總金額',status:'訂單狀態',notes:'備註',order_source:'訂單來源',source_reference:'來源編號',created_at:'訂單建立時間'};
let orders=[],generation=0,loading=false;
const message=s=>$('message').textContent=s||'', money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW'), taiwanTime=s=>s?new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):'';
function el(tag,text=''){const e=document.createElement(tag);e.textContent=text;return e}function option(s,v,t=v){const e=el('option',t);e.value=v;s.append(e)}option($('filter'),'','全部訂單狀態');statuses.forEach(s=>option($('filter'),s));
function resetStats(){['count','pending','paid','total'].forEach(id=>$(id).textContent='—')}
function clearData(){generation++;loading=false;orders=[];$('orders').replaceChildren();$('dashboard').hidden=true;$('loginPanel').hidden=false;$('password').value='';$('search').value='';$('filter').value='';resetStats()}
async function requireAdmin(){const {data,error}=await db.rpc('is_shop_admin');if(error)throw error;if(data!==true){clearData();throw Error('沒有管理員權限，請重新登入')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;message('登入中…');try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error)throw error;await requireAdmin();$('loginPanel').hidden=true;$('dashboard').hidden=false;await loadOrders()}catch(e){clearData();await db.auth.signOut();message('登入失敗：'+e.message)}finally{$('loginButton').disabled=false}};
async function loadOrders(){if(loading)return false;loading=true;const token=++generation;orders=[];resetStats();$('orders').replaceChildren();message('讀取訂單中…');try{await requireAdmin();let result=[];for(let start=0;;start+=500){const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).order('id',{ascending:false}).range(start,start+499);if(error)throw error;if(token!==generation)return false;result.push(...data);if(data.length<500)break}orders=result;$('count').textContent=orders.length;$('pending').textContent=orders.filter(o=>o.status==='待確認').length;$('paid').textContent=orders.filter(o=>o.status==='已收款').length;$('total').textContent=money(orders.filter(o=>o.status!=='已取消').reduce((s,o)=>s+Number(o.total||0),0));renderOrders();message('');return true}catch(e){if(token===generation){orders=[];resetStats();$('orders').replaceChildren();message('讀取失敗：'+e.message)}return false}finally{if(token===generation)loading=false}}
function format(k,v){if(v==null)return '';if(k==='created_at')return taiwanTime(v);if(['subtotal','shipping_fee','total'].includes(k))return money(v);return String(v)}
function renderOrders(){const root=$('orders');root.replaceChildren();const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const filtered=orders.filter(o=>(!f||o.status===f)&&JSON.stringify(o).toLowerCase().includes(q));if(!filtered.length){root.textContent='目前沒有符合的訂單';return}filtered.forEach(o=>{const card=el('article');card.className='order';card.append(el('h3',o.order_no),el('p',(o.customer_name||'')+'｜'+o.status+'｜'+money(o.total)),el('p','建立時間：'+taiwanTime(o.created_at)));const select=el('select');select.setAttribute('aria-label','訂單狀態');statuses.forEach(s=>option(select,s));select.value=o.status;const save=el('button','儲存訂單狀態');card.append(select,save,el('br'));save.onclick=async()=>{const next=select.value;if(next===o.status||!statuses.includes(next))return;if(!confirm('訂單：'+o.order_no+'\n'+o.status+' → '+next+'\n確定修改？'))return;save.disabled=select.disabled=true;try{await requireAdmin();const {data,error}=await db.from('orders').update({status:next}).eq('id',o.id).eq('status',o.status).select('id,status').single();if(error)throw error;if(data?.status!==next)throw Error('未能確認更新結果');if(await loadOrders())message('訂單狀態已更新');}catch(e){message('更新失敗：'+e.message)}finally{save.disabled=select.disabled=false}};const btn=el('button','查看訂單明細'),detail=el('pre');detail.hidden=true;card.append(btn,detail);const edit=el('button','修改訂單');card.append(edit);edit.onclick=()=>editOrder(o);btn.onclick=async()=>{if(!detail.hidden){detail.hidden=true;btn.textContent='查看訂單明細';return}detail.hidden=false;detail.textContent='讀取中…';btn.textContent='收起明細';try{await requireAdmin();const lines=Object.keys(labels).filter(k=>k in o).map(k=>labels[k]+'：'+format(k,o[k]));const {data,error}=await db.from('order_items').select('*').eq('order_id',o.id);if(error)throw error;lines.push('','【訂購商品】');if(!data.length)lines.push('⚠ 此訂單缺少商品明細，請人工確認後再出貨。');data.forEach(i=>lines.push((i.product_name||'商品')+'\n單價：'+money(i.unit_price)+' × '+i.quantity+'\n小計：'+money(i.line_total)+'\n'));detail.textContent=lines.join('\n')}catch(e){detail.textContent='讀取明細失敗：'+e.message}};root.append(card)})}
$('search').oninput=renderOrders;$('filter').onchange=renderOrders;$('refreshButton').onclick=loadOrders;$('logoutButton').onclick=async()=>{clearData();const {error}=await db.auth.signOut();message(error?error.message:'已登出')};
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
$('exportButton').onclick=async()=>{try{await requireAdmin();if(!orders.length){message('沒有可匯出的訂單');return}const keys=Object.keys(labels).filter(k=>orders.some(o=>k in o));const csv=[keys.map(k=>csvCell(labels[k])).join(','),...orders.map(o=>keys.map(k=>csvCell(k==='created_at'?taiwanTime(o[k]):o[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));const a=el('a');a.href=url;a.download='內門新齋味訂單.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){message('匯出失敗：'+e.message)}};db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')clearData()});

const views=['manualView','orderView','productView','stockView','shipView'];
const bundle={1:'魚翅海鮮羹',2:'唐朝一品(腳庫)',4:'櫻花蝦米糕',5:'蝦仁肉捲(八寶丸)',7:'醬燒豬肋排',8:'紹興醉蝦',9:'鮑魚佛跳牆',12:'醉雞腿'};
let reportItems=[]; let reportReady=false; let viewToken=0;
const oldClear=clearData;clearData=function(){oldClear();resetManual();viewToken++;reportItems=[];reportReady=false;['productList','stockList','shipList'].forEach(x=>$(x).replaceChildren());views.forEach(x=>$(x).hidden=x!=='orderView')};
async function allRows(table){let rows=[];for(let n=0;;n+=500){const {data,error}=await db.from(table).select('*').order('id').range(n,n+499);if(error)throw error;rows.push(...data);if(data.length<500)return rows}}
function csvDownload(name,headers,rows){const csv=[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));const a=el('a');a.href=url;a.download=name+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function openView(id){const t=++viewToken;views.forEach(x=>$(x).hidden=x!==id);message('');if(id==='orderView')return;if(id==='manualView'){await loadManual(t);return;}const root=$(id==='productView'?'productList':id==='stockView'?'stockList':'shipList');root.textContent='讀取中…';reportReady=false;try{await requireAdmin();if(id==='productView'){const p=await allRows('products');if(t!==viewToken||$('dashboard').hidden)return;renderProducts(p)}else{if(!await loadOrders())throw Error('訂單讀取失敗');const items=await allRows('order_items');if(t!==viewToken||$('dashboard').hidden)return;reportItems=items;reportReady=true;renderStock();renderShip()}}catch(e){if(t===viewToken){root.textContent='讀取失敗：'+e.message;message(e.message)}}}
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>openView(b.dataset.tab));
function renderProducts(products){const root=$('productList');root.replaceChildren();products.forEach(p=>{const card=el('article');card.className='order';card.append(el('h3',p.id+'｜'+p.name));const fields={};for(const [k,title] of Object.entries({name:'商品名稱',price:'售價',category:'分類',image_url:'照片網址'})){const label=el('label',title);const input=el('input');input.value=p[k]??'';if(k==='price'){input.type='number';input.min='0';input.step='1'}label.append(input);card.append(label);fields[k]=input}const active=el('select');option(active,'true','上架');option(active,'false','下架');active.value=String(p.active);card.append(active);const save=el('button','儲存商品');card.append(save);save.onclick=async()=>{const v={name:fields.name.value.trim(),price:Number(fields.price.value),category:fields.category.value.trim(),image_url:fields.image_url.value.trim()||null,active:active.value==='true'};if(!v.name||!v.category||!fields.price.value.trim()||!Number.isSafeInteger(v.price)||v.price<0||v.price>2147483647){message('請確認品名、分類及整數售價');return}if(v.image_url){try{if(new URL(v.image_url).protocol!=='https:')throw Error()}catch{message('照片網址必須為 HTTPS');return}}if(!confirm('確定儲存商品 '+p.id+'？'))return;save.disabled=true;try{await requireAdmin();const {data,error}=await db.from('products').update(v).eq('id',p.id).select('id').single();if(error||!data)throw error||Error('未確認更新');message('商品已更新')}catch(e){message('更新失敗：'+e.message)}finally{save.disabled=false}};root.append(card)})}
option($('stockStatus'),'confirmed','已確認及後續狀態（不含取消）');option($('stockStatus'),'all','全部未取消（含待確認）');statuses.forEach(s=>option($('stockStatus'),s));
function stockData(){const f=$('stockStatus').value;const selected=orders.filter(o=>f==='all'?o.status!=='已取消':f==='confirmed'? !['待確認','已取消'].includes(o.status):o.status===f);const ids=new Set(selected.map(o=>o.id));const counts=new Map(),seen=new Set();function add(k,name,n){const old=counts.get(k);counts.set(k,{name,n:(old?.n||0)+n})}for(const i of reportItems){if(!ids.has(i.order_id))continue;seen.add(i.order_id);const n=Number(i.quantity);if(Number(i.product_id)===14||i.product_name==='團圓桌菜組'){for(const [k,name] of Object.entries(bundle))add(k,name,n)}else{const k=i.product_id==null?'name:'+i.product_name:String(i.product_id);add(k,bundle[k]||i.product_name,n)}}return {rows:[...counts.values()].sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant')),missing:selected.filter(o=>!seen.has(o.id))}}
function renderStock(){if(!reportReady)return;const root=$('stockList');root.replaceChildren();const d=stockData();d.rows.forEach(r=>root.append(el('p',r.name+'：'+r.n+' 份')));if(!d.rows.length)root.append(el('p','沒有符合的商品明細'));if(d.missing.length)root.append(el('p','⚠ 缺少明細，未納入統計：'+d.missing.map(o=>o.order_no).join('、')))}
$('stockStatus').onchange=renderStock;
async function reportAction(fn){try{await requireAdmin();if(!reportReady)throw Error('請先完成報表讀取');fn()}catch(e){message(e.message)}}
$('stockExport').onclick=()=>reportAction(()=>{const d=stockData();csvDownload('備貨統計',['菜色','數量','備註'],[...d.rows.map(r=>[r.name,r.n,'']),...d.missing.map(o=>['','', '缺少明細：'+o.order_no])])});
$('itemExport').onclick=()=>reportAction(()=>{const map=new Map(orders.map(o=>[o.id,o]));csvDownload('商品明細',['訂單編號','狀態','商品','單價','數量','小計'],reportItems.filter(i=>map.has(i.order_id)).map(i=>[map.get(i.order_id).order_no,map.get(i.order_id).status,i.product_name,i.unit_price,i.quantity,i.line_total]))});
function shipData(){return orders.filter(o=>!['待確認','已取消'].includes(o.status)&&(!$('shipDate').value||o.delivery_date===$('shipDate').value)&&(!$('shipMethod').value||o.delivery_method===$('shipMethod').value)).sort((a,b)=>a.delivery_date.localeCompare(b.delivery_date))}
function itemText(o){return reportItems.filter(i=>i.order_id===o.id).map(i=>i.product_name+' × '+i.quantity).join('；')||'⚠ 缺少明細'}
function renderShip(){if(!reportReady)return;const root=$('shipList');root.replaceChildren();root.append(el('p','排除待確認及已取消；包含已出貨及已完成紀錄。'));const rows=shipData();if(!rows.length)root.append(el('p','沒有符合的訂單'));rows.forEach(o=>{const c=el('article');c.className='order';c.append(el('h3',o.delivery_date+'｜'+o.delivery_method+'｜'+o.status),el('p',o.order_no+'｜'+o.recipient_name),el('p',itemText(o)));root.append(c)})}
$('shipDate').onchange=$('shipMethod').onchange=renderShip;
$('shipExport').onclick=()=>reportAction(()=>csvDownload('出貨清單',['訂單編號','配送日期','配送方式','狀態','收件人','電話','地址','付款方式','金額','商品明細','備註'],shipData().map(o=>[o.order_no,o.delivery_date,o.delivery_method,o.status,o.recipient_name,o.recipient_phone,o.delivery_address,o.payment_method,o.total,itemText(o),o.notes])));

let manualProducts=[],manualBusy=false;
function resetManual(){ $('manualForm').reset();manualProducts=[];$('manualProducts').replaceChildren();$('manualTotal').textContent='';$('manualResult').textContent='';$('manualSave').disabled=true;manualDelivery(); }
function manualDelivery(){const ship=$('mDelivery').value==='宅配';$('mAddressLabel').hidden=!ship;$('mAddress').required=ship;manualQuote()}
function manualItems(){return manualProducts.map(p=>({product_id:p.id,quantity:Number(p.input.value||0)})).filter(i=>i.quantity!==0)}
function manualQuote(){const items=manualItems();const valid=items.every(i=>Number.isSafeInteger(i.quantity)&&i.quantity>0&&i.quantity<=100);const subtotal=items.reduce((n,i)=>n+i.quantity*Number(manualProducts.find(p=>p.id===i.product_id).price),0);const shipping=$('mDelivery').value==='宅配'&&subtotal<4250?290:0;$('manualTotal').textContent=valid?'商品小計：'+money(subtotal)+'｜運費：'+money(shipping)+'｜合計：'+money(subtotal+shipping):'請輸入正整數數量';$('manualSave').disabled=manualBusy||!valid||!items.length;return {items,valid,subtotal,shipping,total:subtotal+shipping}}
async function loadManual(t){if(manualBusy)return;$('manualResult').textContent='讀取商品中…';$('manualSave').disabled=true;try{await requireAdmin();const products=(await allRows('products')).filter(p=>p.active);if(t!==viewToken||$('dashboard').hidden)return;const previous=new Map(manualProducts.map(p=>[p.id,p.input.value]));manualProducts=[];$('manualProducts').replaceChildren();for(const p of products){const label=el('label',p.name+'｜'+money(p.price));const input=el('input');input.type='number';input.min='0';input.step='1';input.value=previous.get(p.id)||'0';input.oninput=manualQuote;label.append(input);$('manualProducts').append(label);manualProducts.push({...p,input})}$('manualResult').textContent=products.length?'':'目前沒有上架商品';manualDelivery()}catch(e){if(t===viewToken)$('manualResult').textContent='讀取失敗：'+e.message}}
$('mDelivery').onchange=manualDelivery;
$('manualForm').onsubmit=async e=>{e.preventDefault();if(manualBusy)return;const q=manualQuote();if(!q.valid||!q.items.length)return;const name=$('mName').value.trim(),phone=$('mPhone').value.trim(),address=$('mAddress').value.trim(),delivery=$('mDelivery').value;if(!name||!phone||(delivery==='宅配'&&!address)){ $('manualResult').textContent='請填寫完整資料';return;}if(!confirm('確定新增訂單？預估合計 '+money(q.total)))return;const t=viewToken;manualBusy=true;$('manualSave').disabled=true;$('manualResult').textContent='儲存中…';try{await requireAdmin();const {data,error}=await db.rpc('save_admin_order',{p_name:name,p_phone:phone,p_address:delivery==='宅配'?address:'',p_date:$('mDate').value,p_notes:$('mNotes').value.trim(),p_items:q.items.map(i=>({id:i.product_id,quantity:i.quantity})),p_delivery_method:delivery,p_payment_method:$('mPayment').value,p_order_source:$('mSource').value,p_source_reference:$('mRef').value.trim()||null});if(error)throw error;if(data?.success!==true)throw Error('未確認儲存結果');if(!$('dashboard').hidden){$('manualForm').reset();manualProducts.forEach(p=>p.input.value='0');manualDelivery();$('manualResult').textContent='新增成功：'+data.order_no+'｜實際金額：'+money(data.total);await loadOrders();}}catch(e){if(!$('dashboard').hidden)$('manualResult').textContent='儲存未確認：'+e.message+'。請先到訂單管理查詢，避免重複新增。'}finally{manualBusy=false;if(!$('dashboard').hidden)manualQuote()}};

let editToken=0;
const previousClear=clearData;clearData=function(){editToken++;document.getElementById('editDialog')?.remove();previousClear()};
async function editOrder(o){
 const token=++editToken;document.getElementById('editDialog')?.remove();message('讀取訂單資料…');
 try{await requireAdmin();const [products,res]=await Promise.all([allRows('products'),db.from('order_items').select('*').eq('order_id',o.id)]);if(res.error)throw res.error;if(token!==editToken||$('dashboard').hidden)return;
 const dialog=el('dialog');dialog.id='editDialog';dialog.style.cssText='width:min(95%,650px);max-height:90vh;overflow:auto;border:1px solid #e7d5b6;border-radius:12px;color:#392b24';const form=el('form');dialog.append(form);form.append(el('h2','修改訂單 '+o.order_no));const fields={};
 function field(k,title,choices){const label=el('label',title),input=el(choices?'select':'input');if(choices)choices.forEach(v=>option(input,v));input.value=o[k]??'';label.append(input);form.append(label);fields[k]=input;return input}
 for(const [k,t] of Object.entries({customer_name:'訂購人姓名',customer_phone:'訂購人電話',recipient_name:'收件人姓名',recipient_phone:'收件人電話'}))field(k,t).required=true;
 const delivery=field('delivery_method','取貨方式',['自取','宅配']);const address=field('delivery_address','宅配地址');const date=field('delivery_date','配送／取貨日期');date.type='date';date.min='2027-01-25';date.max='2027-02-01';date.required=true;
 field('payment_method','付款方式',['現金','轉帳','貨到付款']);field('order_source','訂單來源',[...new Set(['網站','紙本','電話','LINE','其他',o.order_source].filter(Boolean))]);field('source_reference','來源編號');field('notes','備註');
 form.append(el('h3','商品及數量'),el('p','修改時以目前商品售價預估；實際金額以資料庫回傳為準。'));
 const existing=new Map();for(const i of res.data){if(i.product_id==null||!products.some(p=>p.id===i.product_id))throw Error('訂單含已刪除商品，暫不支援修改');existing.set(i.product_id,(existing.get(i.product_id)||0)+i.quantity)}
 const inputs=[];for(const p of products.filter(p=>p.active||existing.has(p.id))){const label=el('label',p.name+'｜'+money(p.price)+(p.active?'':'（已下架）'));const input=el('input');input.type='number';input.min='0';input.max='100';input.step='1';input.value=existing.get(p.id)||0;label.append(input);form.append(label);inputs.push({p,input})}
 const quote=el('p'),result=el('p'),save=el('button','儲存修改'),cancel=el('button','關閉');cancel.type='button';form.append(quote,save,cancel,result);let busy=false;
 function calc(){const rows=inputs.map(({p,input})=>({id:p.id,quantity:Number(input.value||0),price:p.price})).filter(i=>i.quantity!==0);const valid=rows.length>0&&rows.every(i=>Number.isInteger(i.quantity)&&i.quantity>0&&i.quantity<=100);const sub=rows.reduce((n,i)=>n+i.quantity*i.price,0),ship=delivery.value==='宅配'&&sub<4250?290:0;address.required=delivery.value==='宅配';address.parentElement.hidden=!address.required;quote.textContent='預估小計 '+money(sub)+'｜運費 '+money(ship)+'｜合計 '+money(sub+ship);save.disabled=busy||!valid;return {rows,valid}}
 form.oninput=calc;delivery.onchange=calc;cancel.onclick=()=>{if(!busy)dialog.close()};dialog.oncancel=e=>{if(busy)e.preventDefault()};dialog.onclose=()=>dialog.remove();
 form.onsubmit=async e=>{e.preventDefault();const q=calc();if(busy||!q.valid)return;if(!confirm('確定修改此訂單？'))return;busy=true;calc();cancel.disabled=true;result.textContent='儲存中…';try{await requireAdmin();const v=k=>fields[k].value.trim();const {data,error}=await db.rpc('update_admin_order',{p_order_id:o.id,p_customer_name:v('customer_name'),p_customer_phone:v('customer_phone'),p_recipient_name:v('recipient_name'),p_recipient_phone:v('recipient_phone'),p_address:delivery.value==='宅配'?v('delivery_address'):'',p_date:v('delivery_date'),p_delivery_method:delivery.value,p_payment_method:v('payment_method'),p_order_source:v('order_source'),p_source_reference:v('source_reference')||null,p_notes:v('notes'),p_items:q.rows.map(({id,quantity})=>({id,quantity}))});if(error)throw error;if(data?.success===false)throw Error('資料庫未確認修改');if(token!==editToken||$('dashboard').hidden)return;dialog.close();if(await loadOrders())message('修改已送出，請核對最新訂單明細。')}catch(e){result.textContent='修改未確認：'+e.message+'。請重新整理並核對訂單。'}finally{busy=false;cancel.disabled=false;calc()}};
 document.body.append(dialog);dialog.showModal();calc();message('');
 }catch(e){if(token===editToken)message('無法開啟修改：'+e.message)}
}
</script></body></html>

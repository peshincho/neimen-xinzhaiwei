<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>內門新齋味｜年菜訂購</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8f0;color:#38251d;font-family:Arial,'Noto Sans TC',sans-serif}
header{background:#9d1725;color:white;text-align:center;padding:35px 15px}
h1{margin:0;font-size:34px}header p{color:#ffe1a1}
nav{text-align:center;background:#f6dfb6;padding:15px}
nav a{display:inline-block;margin:5px 10px;color:#8d1720;font-weight:bold}
main{max-width:1000px;margin:auto;padding:20px}
h2{color:#9d1725;border-bottom:2px solid #d7aa60;padding-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 9px #0001}
.product-photo {width: 100%;aspect-ratio: 4 / 3;object-fit: contain;background: #fff8f0;border-radius: 12px;display: block;}
.price{color:#b21d29;font-weight:bold;font-size:20px}
button{background:#a21e2c;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;font-size:15px}
button:hover{background:#801621}
.small{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #eee;padding:15px 0}
.small span{min-width:0}.cart-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cart-actions button{padding:8px}
footer{text-align:center;background:#9d1725;color:white;padding:25px;margin-top:40px}
.notice{font-size:14px;color:#725d50}
@media(max-width:480px){h1{font-size:29px}.small{align-items:flex-start}.cart-actions{max-width:52%}}

body{padding-bottom:85px}header{background:linear-gradient(135deg,#780e1b,#b22232);border-bottom:4px solid #d7aa60;padding:28px 12px}header h2{color:#ffe1a1;border:0;margin:10px 0;padding:0;font-size:25px}header p{margin:8px 0}.offer{background:#fff0ce;color:#8d1720;border-radius:10px;padding:12px;line-height:1.7;margin:0 0 22px;text-align:center}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{padding:10px;display:flex;flex-direction:column;min-width:0}.card h3{font-size:16px;margin:10px 0 4px;line-height:1.4}.card .price{margin:6px 0 12px}.card button{margin-top:auto;width:100%}.product-photo{background:#fff;aspect-ratio:4/3;object-fit:contain}.card.bundle{grid-column:1/-1;background:#fff0ce;border:1px solid #d7aa60}.card.bundle button{max-width:240px}#orderForm label{display:block;font-weight:bold}#orderForm input,#orderForm select,#orderForm textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #d6c6b5;border-radius:8px;font:inherit;background:white}#orderForm textarea{min-height:85px}.fixed-cart{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#921727;color:white;text-align:center;padding:15px 8px calc(15px + env(safe-area-inset-bottom));text-decoration:none;font-weight:bold;box-shadow:0 -2px 10px #0002}section{scroll-margin-top:12px}button:disabled{opacity:.6}#orderMessage{overflow-wrap:anywhere}
@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card h3{font-size:15px}.card .price{font-size:18px}.card button{padding:10px 4px;font-size:14px}}
#orderForm input[type=checkbox]{display:inline;width:auto;margin:0 8px 0 0;accent-color:#a21e2c}#orderForm input,#orderForm select,#orderForm textarea{font-size:16px}#shopStatus,#orderMessage{white-space:pre-line;line-height:1.6}#orderMessage{padding:10px;background:#fff0ce;border-radius:8px}#orderMessage:empty{display:none}
.purchase-controls{display:flex;flex-direction:column;gap:8px;margin-top:auto;min-width:0}.qty-control{display:flex;align-items:center;justify-content:center;gap:8px}.qty-control button,.card .qty-control button{width:36px;min-width:36px;height:36px;padding:0;margin:0;font-size:20px}.qty-control output{min-width:28px;text-align:center;font-weight:bold}.small .purchase-controls{flex:0 0 45%;max-width:180px}.card .purchase-controls>button{margin:0}.cart-actions .qty-control{gap:5px}
</style>
</head>
<body>
<header><h1>內門新齋味</h1><h2>2027 新春年菜預購</h2><p>傳承辦桌好滋味・團圓年菜幸福上桌</p></header>
<nav><a href="#products">經典年菜</a><a href="#family">小家庭專區</a><a href="#cart">購物車</a></nav>
<main><div class="offer"><strong>滿 NT$4,250 享免運</strong><br>訂購截止：2027/1/22<br>陸續出貨：1/25–2/1（依宅配公告調整）<br>未滿免運門檻，運費 NT$290</div>
<p id="shopStatus" role="status">正在同步商品及接單狀態…</p><section id="products"><h2>經典年菜</h2><div class="grid" id="productList"></div></section>
<section id="family"><h2>小家庭專區</h2><div id="familyList"></div></section>
<section id="cart"><h2>我的購物車</h2><div id="cartList">尚未選購商品</div><h3 id="total">商品合計：NT$0</h3><p>自取免運；宅配滿 NT$4,250 免運，未滿運費 NT$290。</p><p class="notice">送出訂單後，請等候店家確認。</p></section>
</main>
<footer>內門新齋味｜傳統辦桌年菜</footer>
<a class="fixed-cart" id="fixedCart" href="#cart">購物車｜0 件｜NT$0</a>
<script>
'use strict';
const imageBase='https://jbwofjtmcvqmcapajtex.supabase.co/storage/v1/object/public/product-images/';
// 新照片檔名依本次上傳整理，請在網站逐一核對菜色。
const products=[
  ['魚翅海鮮羹',550,'IMG_0444.jpeg'],
  ['唐朝一品(腳庫)',650,'IMG_0443.jpeg'],
  ['唐朝一品(封肉)',700,'IMG_0447.jpeg'],
  ['櫻花蝦米糕',400,'IMG_0451.jpeg'],
  ['蝦仁肉捲(八寶丸)',350,'IMG_0441.jpeg'],
  ['蛋黃芋丸',250,'IMG_0448.jpeg'],
  ['醬燒豬肋排',600,'IMG_0440.jpeg'],
  ['紹興醉蝦',500,'IMG_0442.jpeg'],
  ['鮑魚佛跳牆',800,'IMG_0449.jpeg'],
  ['何首烏藥膳雞',600,'IMG_0450.jpeg'],
  ['古早味香酥鴨',550,'IMG_0446.jpeg'],
  ['醉雞腿',400,'IMG_0439.jpeg'],
  ['紅燒海鱸魚',450,'IMG_0445.jpeg'],
  ['團圓桌菜組',4250,null]
];
const family=[
  ['魚翅海鮮羹(小家庭)',350],
  ['唐朝一品(小封一斤)',400],
  ['櫻花蝦米糕(小家庭)',230],
  ['香滷筍乾(一斤)',150]
];
const cart=[];
const base='https://jbwofjtmcvqmcapajtex.supabase.co';
const key='sb_publishable_fxFpGtj8PqgAzwg3NdZelQ_Cz4WEwg1';
let accepting=false, busy=false, uncertain=false;
const headers={apikey:key};
async function readTable(path){const r=await fetch(base+'/rest/v1/'+path,{headers,cache:'no-store'});if(!r.ok)throw Error('資料同步失敗');return r.json();}
function setButtons(){document.querySelectorAll('#productList button,#familyList button,#orderForm button[type=submit]').forEach(b=>b.disabled=!accepting||busy||uncertain);}
async function checkSettings(){const rows=await readTable('shop_settings?id=eq.1&select=ordering_enabled,order_deadline,allow_after_deadline,closed_message');const x=rows[0];if(!x)throw Error('無法取得接單設定');accepting=x.ordering_enabled===true&&(x.allow_after_deadline===true||Date.now()<Date.parse(x.order_deadline));document.getElementById('shopStatus').textContent=accepting?'目前開放預購':(x.closed_message||'目前暫停接單');setButtons();return accepting;}

const money=n=>'NT$'+n.toLocaleString('zh-TW');
function add(name,price,id,quantity=1){
  if(!accepting||busy||uncertain)return;
  const item=cart.find(x=>x.name===name);
  if(!Number.isInteger(quantity)||quantity<1||quantity>100)return;
  if(item){if(item.qty+quantity>100){alert("每項商品最多100份");return;}item.qty+=quantity;}
  else cart.push({name,price,id,qty:quantity});
  renderCart();
}
function removeItem(i){
  if(!cart[i]||busy||uncertain)return;
  cart[i].qty--;
  if(cart[i].qty===0)cart.splice(i,1);
  renderCart();
}
function renderCart(){
  const sum=cart.reduce((s,x)=>s+x.price*x.qty,0);
  document.getElementById('fixedCart').textContent='購物車｜'+cart.reduce((s,x)=>s+x.qty,0)+' 件｜'+money(sum);
  const list=document.getElementById('cartList');
  list.replaceChildren();
  if(!cart.length){list.textContent='尚未選購商品';}
  cart.forEach((x,i)=>{
    const line=document.createElement('div');line.className='small';
    const name=document.createElement('span');name.textContent=x.name+' × '+x.qty;
    const right=document.createElement('span');right.className='cart-actions';
    const amount=document.createElement('strong');amount.textContent=money(x.price*x.qty);
    const remove=document.createElement('button');remove.type='button';remove.textContent='移除一件';remove.addEventListener('click',()=>removeItem(i));
    const plus=document.createElement('button');plus.type='button';plus.textContent='＋';plus.setAttribute('aria-label','增加'+x.name+'一份');plus.addEventListener('click',()=>add(x.name,x.price,x.id));remove.textContent='－';remove.setAttribute('aria-label','減少'+x.name+'一份');const qty=document.createElement('span');qty.textContent=x.qty;const controls=document.createElement('span');controls.className='qty-control';controls.append(remove,qty,plus);right.append(amount,controls);line.append(name,right);list.append(line);
  });
  document.getElementById('total').textContent='商品合計：'+money(sum)+'｜含運預估：'+money(sum?sum+((document.getElementById('deliveryMethod')?.value==='自取'||sum>=4250)?0:290):0);
}
function makeButton(name,price,id){
  const button=document.createElement('button');button.type='button';button.textContent='加入購物車';
  const wrap=document.createElement('div');wrap.className='purchase-controls';
  const controls=document.createElement('div');controls.className='qty-control';
  let quantity=1;const value=document.createElement('output');value.textContent='1';
  for(const [label,delta] of [['－',-1],['＋',1]]){const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-label',(delta<0?'減少':'增加')+name+'數量');b.addEventListener('click',()=>{quantity=Math.max(1,Math.min(100,quantity+delta));value.textContent=quantity;});if(delta<0)controls.append(b,value);else controls.append(b);}
  button.addEventListener('click',()=>add(name,price,id,quantity));wrap.append(controls,button);return wrap;
}
async function loadProducts(){
 const rows=await readTable('products?select=id,name,price,category,active,image_url&active=eq.true&order=id.asc');
 const productList=document.getElementById('productList'),familyList=document.getElementById('familyList');
 productList.replaceChildren();familyList.replaceChildren();
 for(const p of rows){
 const {id,name,price}=p;
 if(!Number.isInteger(price)||price<0)continue;
 const small=String(p.category).includes('小家庭')||family.some(x=>x[0]===name);
 if(small){const line=document.createElement('div');line.className='small';const info=document.createElement('span');info.textContent=name+'｜'+money(price);line.append(info,makeButton(name,price,id));familyList.append(line);continue;}
 const card=document.createElement('div');card.className='card';const bundle=id===14||name.includes('桌菜');if(bundle)card.classList.add('bundle');
 const old=products.find(x=>x[0]===name)?.[2];
 if(!bundle&&(p.image_url||old)){const img=document.createElement('img');img.className='product-photo';img.alt=name;img.loading='lazy';const fallback=old?imageBase+encodeURIComponent(old):'';img.src=p.image_url||fallback;img.onerror=()=>{if(fallback&&img.src!==fallback)img.src=fallback;else img.remove();};card.append(img);}
 const title=document.createElement('h3');title.textContent=name;const amount=document.createElement('p');amount.className='price';amount.textContent=money(price);card.append(title,amount,makeButton(name,price,id));productList.append(card);
 }
 setButtons();
}
renderCart();// 顯示訂購表單
const checkoutSection = document.createElement('section');
checkoutSection.innerHTML = `
  <h2>填寫訂購資料</h2>
  <form id="orderForm">
    <p><label>取貨方式<select id="deliveryMethod"><option>宅配</option><option>自取</option></select></label></p>
    <p><label>付款方式<select id="paymentMethod"><option>現金</option><option>轉帳</option><option>貨到付款</option></select></label></p>
    <p><label>訂購人姓名
      <input id="customerName" required>
    </label></p>
    <p><label>訂購人電話
      <input id="customerPhone" type="tel" required>
    </label></p>
    <p><label><input type="checkbox" id="sameRecipient">收件人同訂購人</label></p>
    <p><label>收件人姓名
      <input id="recipientName" required>
    </label></p>
    <p><label>收件人電話
      <input id="recipientPhone" type="tel" required>
    </label></p>
    <p id="addressRow"><label>宅配地址
      <input id="deliveryAddress" required>
    </label></p>
    <p><label>希望出貨／自取日期
      <input id="deliveryDate" type="date" min="2027-01-25" max="2027-02-01" required>
    </label></p>
    <p><label>訂單備註
      <textarea id="orderNotes"></textarea>
    </label></p>
    <button type="submit">確認送出訂單</button>
    <p id="orderMessage" role="status" aria-live="polite"></p>
  </form>
`;
document.getElementById('cart').after(checkoutSection);
function updateDelivery(){
 const pickup=document.getElementById('deliveryMethod').value==='自取';
 document.getElementById('addressRow').hidden=pickup;
 document.getElementById('deliveryAddress').required=!pickup;
 renderCart();
}
document.getElementById('deliveryMethod').addEventListener('change',updateDelivery);
updateDelivery();
function syncRecipient(){const same=document.getElementById('sameRecipient').checked;for(const [a,b] of [['customerName','recipientName'],['customerPhone','recipientPhone']]){const dest=document.getElementById(b);dest.readOnly=same;if(same)dest.value=document.getElementById(a).value;}}
for(const id of ['sameRecipient','customerName','customerPhone'])document.getElementById(id).addEventListener('input',syncRecipient);
setButtons();
(async()=>{try{await loadProducts();await checkSettings();}catch(e){accepting=false;setButtons();document.getElementById('shopStatus').textContent='無法同步商品或接單設定，請重新整理後再試。';}})();
document.getElementById('orderForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const message = document.getElementById('orderMessage');
  const button = this.querySelector('button[type="submit"]');

  if(busy||uncertain||!accepting)return;
  if (!cart.length) {
    message.textContent = '請先選購商品';
    return;
  }

  const data = {
    name: document.getElementById('customerName').value.trim(),
    phone: document.getElementById('customerPhone').value.trim(),
    address: document.getElementById('deliveryMethod').value==='自取'?'':document.getElementById('deliveryAddress').value.trim(),
    delivery_method: document.getElementById('deliveryMethod').value,
    payment_method: document.getElementById('paymentMethod').value,
    date: document.getElementById('deliveryDate').value,
    recipient_name: document.getElementById('recipientName').value.trim(),
    recipient_phone: document.getElementById('recipientPhone').value.trim(),
    notes: document.getElementById('orderNotes').value.trim(),
    items: cart.map(x => ({id:x.id,quantity:x.qty}))
  };

  busy=true;setButtons();
  button.disabled = true;
  message.textContent = '訂單送出中，請稍候…';

  try {
    if(!await checkSettings()){message.textContent='目前暫停接單';return;}
    const response = await fetch(
      'https://jbwofjtmcvqmcapajtex.supabase.co/functions/v1/create-order',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey:key },
        body: JSON.stringify(data)
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || '訂單送出失敗');
    }

    message.textContent = '訂購成功！訂單編號：' + result.order_no + '\n商品小計：'+money(result.subtotal)+'\n運費：'+money(result.shipping_fee)+'\n總金額：'+money(result.total)+'\n請保留訂單編號，等候店家確認。';
    this.reset();syncRecipient();
    cart.length = 0;
    updateDelivery();
  } catch (error) {
    uncertain=true;message.textContent = '未能確認訂單結果：' + error.message + '。請先聯絡店家確認是否已收到訂單，勿重複送出。';
  } finally {
    busy=false;setButtons();
  }
});
</script>
</body>
</html>

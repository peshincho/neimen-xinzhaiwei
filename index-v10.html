<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>內門新齋味｜年菜訂購</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8f0;color:#38251d;font-family:Arial,'Noto Sans TC',sans-serif}
header{background:#9d1725;color:white;text-align:center;padding:35px 15px}
h1{margin:0;font-size:34px}header p{color:#ffe1a1}
nav{text-align:center;background:#f6dfb6;padding:15px}
nav a{display:inline-block;margin:5px 10px;color:#8d1720;font-weight:bold}
main{max-width:1000px;margin:auto;padding:20px}
h2{color:#9d1725;border-bottom:2px solid #d7aa60;padding-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 9px #0001}
.product-photo {width: 100%;aspect-ratio: 4 / 3;object-fit: contain;background: #fff8f0;border-radius: 12px;display: block;}
.price{color:#b21d29;font-weight:bold;font-size:20px}
button{background:#a21e2c;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;font-size:15px}
button:hover{background:#801621}
.small{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #eee;padding:15px 0}
.small span{min-width:0}.cart-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cart-actions button{padding:8px}
footer{text-align:center;background:#9d1725;color:white;padding:25px;margin-top:40px}
.notice{font-size:14px;color:#725d50}
@media(max-width:480px){h1{font-size:29px}.small{align-items:flex-start}.cart-actions{max-width:52%}}

body{padding-bottom:85px}header{background:linear-gradient(135deg,#780e1b,#b22232);border-bottom:4px solid #d7aa60;padding:28px 12px}header h2{color:#ffe1a1;border:0;margin:10px 0;padding:0;font-size:25px}header p{margin:8px 0}.offer{background:#fff0ce;color:#8d1720;border-radius:10px;padding:12px;line-height:1.7;margin:0 0 22px;text-align:center}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{padding:10px;display:flex;flex-direction:column;min-width:0}.card h3{font-size:16px;margin:10px 0 4px;line-height:1.4}.card .price{margin:6px 0 12px}.card button{margin-top:auto;width:100%}.product-photo{background:#fff;aspect-ratio:4/3;object-fit:contain}.card.bundle{grid-column:1/-1;background:#fff0ce;border:1px solid #d7aa60}.card.bundle button{max-width:240px}#orderForm label{display:block;font-weight:bold}#orderForm input,#orderForm select,#orderForm textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #d6c6b5;border-radius:8px;font:inherit;background:white}#orderForm textarea{min-height:85px}.fixed-cart{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#921727;color:white;text-align:center;padding:15px 8px calc(15px + env(safe-area-inset-bottom));text-decoration:none;font-weight:bold;box-shadow:0 -2px 10px #0002}section{scroll-margin-top:12px}button:disabled{opacity:.6}#orderMessage{overflow-wrap:anywhere}
@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card h3{font-size:15px}.card .price{font-size:18px}.card button{padding:10px 4px;font-size:14px}}
</style>
</head>
<body>
<header><h1>內門新齋味</h1><h2>2027 新春年菜預購</h2><p>傳承辦桌好滋味・團圓年菜幸福上桌</p></header>
<nav><a href="#products">經典年菜</a><a href="#family">小家庭專區</a><a href="#cart">購物車</a></nav>
<main><div class="offer"><strong>滿 NT$4,250 享免運</strong><br>訂購截止：2027/1/22<br>陸續出貨：1/25–2/1（依宅配公告調整）<br>未滿免運門檻，運費 NT$290</div>
<section id="products"><h2>經典年菜</h2><div class="grid" id="productList"></div></section>
<section id="family"><h2>小家庭專區</h2><div id="familyList"></div></section>
<section id="cart"><h2>我的購物車</h2><div id="cartList">尚未選購商品</div><h3 id="total">商品合計：NT$0</h3><p>自取免運；宅配滿 NT$4,250 免運，未滿運費 NT$290。</p><p class="notice">送出訂單後，請等候店家確認。</p></section>
</main>
<footer>內門新齋味｜傳統辦桌年菜</footer>
<a class="fixed-cart" id="fixedCart" href="#cart">購物車｜0 件｜NT$0</a>
<script>
'use strict';
const base='https://jbwofjtmcvqmcapajtex.supabase.co';
const key='sb_publishable_fxFpGtj8PqgAzwg3NdZelQ_Cz4WEwg1';
const headers={apikey:key};
let products=[], accepting=false, settings=null;
async function readTable(table,query=''){
 const r=await fetch(base+'/rest/v1/'+table+'?'+query,{headers,cache:'no-store'});
 if(!r.ok)throw Error('資料同步失敗'); return r.json();
}
const cart=[];
const money=n=>'NT$'+n.toLocaleString('zh-TW');
function add(name,price){
  if(!accepting)return;
  const item=cart.find(x=>x.name===name);
  if(item)item.qty++;
  else cart.push({name,price,qty:1});
  renderCart();
}
function removeItem(i){
  if(!cart[i])return;
  cart[i].qty--;
  if(cart[i].qty===0)cart.splice(i,1);
  renderCart();
}
function renderCart(){
  const sum=cart.reduce((s,x)=>s+x.price*x.qty,0);
  document.getElementById('fixedCart').textContent='購物車｜'+cart.reduce((s,x)=>s+x.qty,0)+' 件｜'+money(sum);
  const list=document.getElementById('cartList');
  list.replaceChildren();
  if(!cart.length){list.textContent='尚未選購商品';}
  cart.forEach((x,i)=>{
    const line=document.createElement('div');line.className='small';
    const name=document.createElement('span');name.textContent=x.name+' × '+x.qty;
    const right=document.createElement('span');right.className='cart-actions';
    const amount=document.createElement('strong');amount.textContent=money(x.price*x.qty);
    const remove=document.createElement('button');remove.type='button';remove.textContent='移除一件';remove.addEventListener('click',()=>removeItem(i));
    right.append(amount,remove);line.append(name,right);list.append(line);
  });
  document.getElementById('total').textContent='商品合計：'+money(sum)+'｜含運預估：'+money(sum?sum+((document.getElementById('deliveryMethod')?.value==='自取'||sum>=4250)?0:290):0);
}
function makeButton(name,price){
  const button=document.createElement('button');button.type='button';button.textContent='加入購物車';
  button.addEventListener('click',()=>add(name,price));return button;
}
const productList=document.getElementById('productList');
const familyList=document.getElementById('familyList');
const banner=document.createElement('p');banner.setAttribute('role','status');banner.style.cssText='padding:12px;background:#fff0ce;text-align:center;font-weight:bold';document.querySelector('.offer').after(banner);
function drawProducts(){
 productList.replaceChildren();familyList.replaceChildren();
 for(const p of products){
 const small=String(p.category||'').includes('小家庭');
 const card=document.createElement('div');card.className=small?'small':(p.name.includes('桌菜組')?'card bundle':'card');
 if(!small&&p.image_url){const img=document.createElement('img');img.className='product-photo';img.src=p.image_url;img.alt=p.name;img.loading='lazy';img.onerror=()=>img.remove();card.append(img);}
 const title=document.createElement(small?'span':'h3');title.textContent=p.name;
 const amount=document.createElement('span');amount.className='price';amount.textContent=money(p.price);
 const button=makeButton(p.name,p.price);button.disabled=!accepting;
 card.append(title,amount,button);(small?familyList:productList).append(card);
 }
}
async function sync(){
 try{
 const [rows,config]=await Promise.all([readTable('products','select=id,name,price,category,active,image_url&active=eq.true&order=id'),readTable('shop_settings','select=*&id=eq.1')]);
 if(!config.length)throw Error('找不到接單設定');
 settings=config[0];products=rows;
 const deadline=Date.parse(settings.order_deadline);
 accepting=settings.ordering_enabled===true&&(settings.allow_after_deadline===true||(Number.isFinite(deadline)&&Date.now()<deadline));
 banner.textContent=accepting?'年菜預購開放中':(settings.closed_message||'目前暫停接單');
 for(let i=cart.length-1;i>=0;i--){const p=products.find(p=>p.name===cart[i].name);if(!p)cart.splice(i,1);else cart[i].price=p.price;}
 drawProducts();renderCart();
 }catch(e){accepting=false;banner.textContent='暫時無法同步商品與接單設定，請稍後重新整理。';drawProducts();}
 document.querySelector('#orderForm button[type=submit]').disabled=!accepting;
}
renderCart();// 顯示訂購表單
const checkoutSection = document.createElement('section');
checkoutSection.innerHTML = `
  <h2>填寫訂購資料</h2>
  <form id="orderForm">
    <p><label>取貨方式<select id="deliveryMethod"><option>宅配</option><option>自取</option></select></label></p>
    <p><label>付款方式<select id="paymentMethod"><option>現金</option><option>轉帳</option><option>貨到付款</option></select></label></p>
    <p><label>訂購人姓名
      <input id="customerName" required>
    </label></p>
    <p><label>訂購人電話
      <input id="customerPhone" type="tel" required>
    </label></p>
    <p><label>收件人姓名
      <input id="recipientName" required>
    </label></p>
    <p><label>收件人電話
      <input id="recipientPhone" type="tel" required>
    </label></p>
    <p id="addressRow"><label>宅配地址
      <input id="deliveryAddress" required>
    </label></p>
    <p><label>希望出貨／自取日期
      <input id="deliveryDate" type="date" min="2027-01-25" max="2027-02-01" required>
    </label></p>
    <p><label>訂單備註
      <textarea id="orderNotes"></textarea>
    </label></p>
    <button type="submit">確認送出訂單</button>
    <p id="orderMessage"></p>
  </form>
`;
document.getElementById('cart').after(checkoutSection);
function updateDelivery(){
 const pickup=document.getElementById('deliveryMethod').value==='自取';
 document.getElementById('addressRow').hidden=pickup;
 document.getElementById('deliveryAddress').required=!pickup;
 renderCart();
}
document.getElementById('deliveryMethod').addEventListener('change',updateDelivery);
updateDelivery();
document.getElementById('orderForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const message = document.getElementById('orderMessage');
  const button = this.querySelector('button[type="submit"]');

  if (!cart.length) {
    message.textContent = '請先選購商品';
    return;
  }

  const before=JSON.stringify(cart);
  await sync();
  if(!accepting){message.textContent='目前無法接單';return;}
  if(before!==JSON.stringify(cart)){message.textContent='商品或價格已更新，請重新確認購物車。';return;}
  const data = {
    recipient_name: document.getElementById('recipientName').value.trim(),
    recipient_phone: document.getElementById('recipientPhone').value.trim(),
    name: document.getElementById('customerName').value.trim(),
    phone: document.getElementById('customerPhone').value.trim(),
    address: document.getElementById('deliveryMethod').value==='自取'?'':document.getElementById('deliveryAddress').value.trim(),
    delivery_method: document.getElementById('deliveryMethod').value,
    payment_method: document.getElementById('paymentMethod').value,
    date: document.getElementById('deliveryDate').value,
    notes: [
      '收件人：' + document.getElementById('recipientName').value.trim(),
      '收件電話：' + document.getElementById('recipientPhone').value.trim(),
      document.getElementById('orderNotes').value.trim()
    ].join('\n'),
    items: cart.map(x => ({
      product_id: products.find(p=>p.name===x.name)?.id,
      name: x.name,
      price: x.price,
      quantity: x.qty
    }))
  };

  button.disabled = true;
  message.textContent = '訂單送出中，請稍候…';

  try {
    const response = await fetch(
      'https://jbwofjtmcvqmcapajtex.supabase.co/functions/v1/create-order',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || '訂單送出失敗');
    }

    message.textContent = '訂購成功！訂單編號：' + result.order_no;
    this.reset();
    cart.length = 0;
    updateDelivery();
  } catch (error) {
    message.textContent = '送出失敗：' + error.message;
  } finally {
    button.disabled = !accepting;
  }
});
sync();
window.addEventListener("focus",sync);
setInterval(sync,60000);
</script>
</body>
</html>
